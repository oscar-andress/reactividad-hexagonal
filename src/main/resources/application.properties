# Nombre de la aplicación (Se mantiene igual)
spring.application.name=food_menu_reactivo

# ---------------------------------------------------------
# 1. CONFIGURACIÓN DE CONEXIÓN REACTIVA (R2DBC)
# ---------------------------------------------------------
# IMPORTANTE: La URL debe empezar con 'r2dbc:' y no con 'jdbc:'
# Ejemplo de valor real: r2dbc:postgresql://localhost:5432/food_menu_db
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/food_menu_reactivo_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# (Opcional) Pool de conexiones reactivo
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# ---------------------------------------------------------
# 2. VER LAS CONSULTAS SQL EN CONSOLA (Equivalente a show-sql=true)
# ---------------------------------------------------------
# Como no hay JPA, activamos los logs directamente en el módulo R2DBC
logging.level.org.springframework.r2dbc=DEBUG
#logging.level.io.r2dbc.postgresql.QUERY=DEBUG
#logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# ---------------------------------------------------------S
# 3. CREACIÓN DEL ESQUEMA (Equivalente a ddl-auto=update)
# ---------------------------------------------------------
# R2DBC no crea tablas automáticamente. 
# Si creas un archivo 'schema.sql' en src/main/resources, 
# esta propiedad le dirá a Spring que lo ejecute al iniciar.
# spring.sql.init.data-locations=classpath:db/schema.sql

#---------------------------------------------------------
# 4. CONFIGURACIÓN DE AWS S3
#---------------------------------------------------------
aws.s3.bucket-name=imagenes-menu
aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test

#---------------------------------------------------------
# 5. RESILIENCE4J (Gap D: Resiliencia Avanzada)
#---------------------------------------------------------
# menu-service-reactivo: protege los write paths de MenuRepositoryAdapter
# (save/deleteById/saveAll) contra fallos transitorios y saturación.
resilience4j.retry.instances.menu-service-reactivo.max-attempts=3
resilience4j.retry.instances.menu-service-reactivo.wait-duration=50ms
resilience4j.retry.instances.menu-service-reactivo.enable-exponential-backoff=true
resilience4j.retry.instances.menu-service-reactivo.exponential-backoff-multiplier=2

resilience4j.bulkhead.instances.menu-service-reactivo.max-concurrent-calls=4
resilience4j.bulkhead.instances.menu-service-reactivo.max-wait-duration=0

# orders-menu-lookup: aísla las llamadas de Orders hacia Menu (MenuLookupPortAdapter).
# Carril propio y separado de menu-service-reactivo — si Menu se pone lento, esto
# limita cuánto puede "contagiarle" a Orders, sin afectar al resto de la aplicación.
resilience4j.bulkhead.instances.orders-menu-lookup.max-concurrent-calls=3
resilience4j.bulkhead.instances.orders-menu-lookup.max-wait-duration=0

# s3-image-storage: límite de tiempo para upload/presign — hoy sin ningún control,
# un S3 colgado podía dejar la llamada esperando indefinidamente.
resilience4j.timelimiter.instances.s3-image-storage.timeout-duration=2s
resilience4j.timelimiter.instances.s3-image-storage.cancel-running-future=true

#---------------------------------------------------------
# 6. OBSERVABILIDAD (Gap D: Resiliencia Avanzada, ejercicio 4)
#---------------------------------------------------------
# Expone /actuator/metrics además del /actuator/health que ya estaba expuesto por
# defecto — necesario para poder leer los contadores de negocio desde afuera.
management.endpoints.web.exposure.include=health,metrics

#---------------------------------------------------------
# 7. SEGURIDAD: JWT (Gap B, ejercicio 3)
#---------------------------------------------------------
# Reemplaza el AUTH_CATEGORY_MAP hardcodeado — ver docs/security/threat-model.md.
# IMPORTANTE: este secreto es solo para desarrollo local. En cualquier entorno real
# debe sobreescribirse (variable de entorno / secret manager), nunca quedar en Git.
security.jwt.secret=dev-only-secret-change-me-in-any-real-environment-00
security.jwt.expiration=15m

#---------------------------------------------------------
# 8. SEGURIDAD: RATE LIMITING (Gap B, ejercicio 4)
#---------------------------------------------------------
# Previene abuso/DoS en las dos rutas que disparan trabajo pesado real (escrituras
# masivas a la base, subidas a S3) — ver docs/security/threat-model.md.
resilience4j.ratelimiter.instances.create-menus-bulk.limit-for-period=5
resilience4j.ratelimiter.instances.create-menus-bulk.limit-refresh-period=1s
resilience4j.ratelimiter.instances.create-menus-bulk.timeout-duration=0

resilience4j.ratelimiter.instances.menu-image-upload.limit-for-period=5
resilience4j.ratelimiter.instances.menu-image-upload.limit-refresh-period=1s
resilience4j.ratelimiter.instances.menu-image-upload.timeout-duration=0

#---------------------------------------------------------
# 9. GOBERNANZA DE IA (Gap C)
#---------------------------------------------------------
# ai-food-type-classifier: límites de costo/riesgo sobre la llamada al "LLM" (ver
# docs/ai-governance.md) — timeout para no quedar esperando indefinidamente, y rate
# limit para no generar costo ilimitado si alguien dispara el endpoint de sugerencia
# en bucle.
resilience4j.timelimiter.instances.ai-food-type-classifier.timeout-duration=3s
resilience4j.timelimiter.instances.ai-food-type-classifier.cancel-running-future=true

resilience4j.ratelimiter.instances.ai-food-type-classifier.limit-for-period=5
resilience4j.ratelimiter.instances.ai-food-type-classifier.limit-refresh-period=1s
resilience4j.ratelimiter.instances.ai-food-type-classifier.timeout-duration=0