# Nombre de la aplicación (Se mantiene igual)
spring.application.name=food_menu_reactivo

# ---------------------------------------------------------
# 1. CONFIGURACIÓN DE CONEXIÓN REACTIVA (R2DBC)
# ---------------------------------------------------------
# IMPORTANTE: La URL debe empezar con 'r2dbc:' y no con 'jdbc:'
# Ejemplo de valor real: r2dbc:postgresql://localhost:5432/food_menu_db
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/food_menu_reactivo_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# (Opcional) Pool de conexiones reactivo
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# ---------------------------------------------------------
# 2. VER LAS CONSULTAS SQL EN CONSOLA (Equivalente a show-sql=true)
# ---------------------------------------------------------
# Como no hay JPA, activamos los logs directamente en el módulo R2DBC
logging.level.org.springframework.r2dbc=DEBUG
#logging.level.io.r2dbc.postgresql.QUERY=DEBUG
#logging.level.io.r2dbc.postgresql.PARAM=DEBUG

# ---------------------------------------------------------S
# 3. CREACIÓN DEL ESQUEMA (Equivalente a ddl-auto=update)
# ---------------------------------------------------------
# R2DBC no crea tablas automáticamente. 
# Si creas un archivo 'schema.sql' en src/main/resources, 
# esta propiedad le dirá a Spring que lo ejecute al iniciar.
# spring.sql.init.data-locations=classpath:db/schema.sql

#---------------------------------------------------------
# 4. CONFIGURACIÓN DE AWS S3
#---------------------------------------------------------
aws.s3.bucket-name=imagenes-menu
aws.s3.endpoint=http://localhost:4566
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test